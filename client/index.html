<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lolo & Pepe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400&family=Outfit:wght@300;400;500&display=swap" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .35s ease; }
      #splash .phrase { height: 46px; position: relative; width: min(320px, calc(100vw - 48px)); font-family: 'Outfit', -apple-system, sans-serif; font-size: 16px; line-height: 1.3; color: #6f6f6f; }
      #splash .phrase > div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; animation: phraseIn .45s ease both; }
      #splash .phrase > div.out { animation: phraseOut .35s ease both; }
      #splash .phrase .e { display: inline-block; font-size: 17px; }
      #splash .dots i { font-style: normal; animation: dot 1.2s infinite; opacity: .2; }
      #splash .dots i:nth-child(2) { animation-delay: .2s; }
      #splash .dots i:nth-child(3) { animation-delay: .4s; }
      @keyframes phraseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes phraseOut { to { opacity: 0; transform: translateY(-14px); } }
      @keyframes dot { 0%, 100% { opacity: .2; } 40% { opacity: 1; } }
      @keyframes spin { to { transform: rotateY(360deg); } }
      @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
      @keyframes write { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(3px, -2px) rotate(-8deg); } 50% { transform: translate(6px, 0) rotate(0); } 75% { transform: translate(3px, 2px) rotate(8deg); } }
      @keyframes swing { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-25deg); } }
      @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4px, -4px); } }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .stage { display: grid; width: min(82vw, 360px); aspect-ratio: 1 / 1; }
      #splash .stage > * { grid-area: 1 / 1; width: 100%; height: 100%; }
      #splash video { opacity: 0; }
      #splash video.playing { opacity: 1; }
      #splash video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
      #splash video::-webkit-media-controls { display: none !important; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="stage">
        <img class="still" src="/loading-poster.jpg" alt="" />
        <video src="/loading.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
      </div>
      <div class="phrase" aria-live="polite"></div>
    </div>
    <script>
      (function () {
        var PHRASES = [
          ['🪙', 'spin', 'Считаем траты'],
          ['🧾', 'swing', 'Сверяем чеки'],
          ['🐷', 'bounce', 'Пополняем копилку'],
          ['📊', 'pulse', 'Проверяем лимиты'],
          ['🔮', 'float', 'Готовим прогноз на месяц'],
          ['🧮', 'wiggle', 'Считаем, сколько осталось'],
          ['🤝', 'pulse', 'Сводим, кто кому должен'],
          ['✏️', 'write', 'Раскладываем по категориям'],
          ['🎯', 'bounce', 'Смотрим, как там цели'],
          ['🐧', 'wiggle', 'Пингвины уже бегут'],
        ];
        var box = document.querySelector('#splash .phrase');
        var order = PHRASES.map(function (_, i) { return i; }).sort(function () { return Math.random() - .5; });
        var n = 0;
        function show() {
          if (!box.isConnected) return;
          var p = PHRASES[order[n++ % order.length]];
          var old = box.firstElementChild;
          if (old) { old.className = 'out'; setTimeout(function () { old.remove(); }, 350); }
          var el = document.createElement('div');
          el.innerHTML = '<span class="e" style="animation:' + p[1] + ' 1.1s ease-in-out infinite">' + p[0] + '</span>' +
            '<span>' + p[2] + '<span class="dots"><i>.</i><i>.</i><i>.</i></span></span>';
          box.appendChild(el);
          setTimeout(show, 1600);
        }
        show();
      })();
    </script>
    <script>
      // The video stays invisible until it really plays, so an autoplay-blocked phone (iOS Low Power Mode)
      // never shows its play button; in that case the still frame is swapped for an equivalent GIF.
      (function () {
        var video = document.querySelector('#splash video');
        var still = document.querySelector('#splash .still');
        var settled = false;
        video.addEventListener('playing', function () {
          if (settled) return;
          settled = true;
          video.classList.add('playing');
        });
        function useGif() {
          if (settled) return;
          settled = true;
          video.remove();
          var gif = new Image();
          gif.onload = function () { still.src = gif.src; };
          gif.src = '/loading.gif';
        }
        var started = video.play();
        if (started && started.catch) started.catch(useGif);
        setTimeout(function () { if (video.paused) useGif(); }, 600);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
