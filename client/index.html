<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lolo & Pepe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400&family=Outfit:wght@300;400;500&display=swap" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; align-items: center; justify-content: center; transition: opacity .35s ease; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .stage { display: grid; width: min(86vw, 400px); aspect-ratio: 600 / 388; }
      #splash .stage > * { grid-area: 1 / 1; width: 100%; height: 100%; }
      #splash video { opacity: 0; }
      #splash video.playing { opacity: 1; }
      #splash video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
      #splash video::-webkit-media-controls { display: none !important; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="stage">
        <img class="still" src="/loading-poster.jpg" alt="" />
        <video src="/loading.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
      </div>
    </div>
    <script>
      // The video stays invisible until it really plays, so an autoplay-blocked phone (iOS Low Power Mode)
      // never shows its play button; in that case the still frame is swapped for an equivalent GIF.
      (function () {
        var video = document.querySelector('#splash video');
        var still = document.querySelector('#splash .still');
        var settled = false;
        video.addEventListener('playing', function () {
          if (settled) return;
          settled = true;
          video.classList.add('playing');
        });
        function useGif() {
          if (settled) return;
          settled = true;
          video.remove();
          var gif = new Image();
          gif.onload = function () { still.src = gif.src; };
          gif.src = '/loading.gif';
        }
        var started = video.play();
        if (started && started.catch) started.catch(useGif);
        setTimeout(function () { if (video.paused) useGif(); }, 600);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
