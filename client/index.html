<!DOCTYPE html>
<html lang="ru">
  <head>
    <script>
      // Outside Telegram (a plain browser) show the landing page instead of the Mini App. Never on localhost.
      (function () {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]') return;
        var inTg = location.hash.indexOf('tgWebAppData') !== -1 ||
          location.search.indexOf('tgWebAppStartParam') !== -1 ||
          !!window.TelegramWebviewProxy ||
          (function () { try { return !!sessionStorage.getItem('__telegram__initParams'); } catch (e) { return false; } })() ||
          /Telegram/i.test(navigator.userAgent);
        if (!inTg) location.replace('/landing/');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lolo & Pepe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400&family=Outfit:wght@300;400;500&display=swap" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .35s ease; }
      #splash .phrase {
        height: 20px; position: relative; width: min(320px, calc(100vw - 48px));
        font-family: 'Unbounded', 'Outfit', -apple-system, sans-serif; font-weight: 400; font-size: 11px;
        letter-spacing: .2em; text-transform: uppercase; color: #5f5f5f;
      }
      #splash .phrase > div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; animation: phraseIn .5s ease both; }
      #splash .phrase > div.out { animation: phraseOut .4s ease both; }
      @keyframes phraseIn { from { opacity: 0; letter-spacing: .35em; } to { opacity: 1; letter-spacing: .2em; } }
      @keyframes phraseOut { to { opacity: 0; } }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .stage { display: grid; width: min(82vw, 360px); aspect-ratio: 1 / 1; }
      #splash .stage > * { grid-area: 1 / 1; width: 100%; height: 100%; }
    </style>
    <link rel="preload" href="/loading-sprite.png" as="image" />
  </head>
  <body>
    <div id="splash">
      <div class="stage">
        <img class="still" src="/loading-poster.jpg" alt="" />
        <canvas width="640" height="640" aria-hidden="true"></canvas>
      </div>
      <div class="phrase" aria-live="polite"></div>
    </div>
    <script>
      (function () {
        var PHRASES = [
          'Считаем траты',
          'Сверяем чеки',
          'Проверяем лимиты',
          'Готовим прогноз',
          'Считаем остаток',
          'Пополняем копилку',
          'Делим поровну',
          'Собираем итоги',
        ];
        var box = document.querySelector('#splash .phrase');
        var order = PHRASES.map(function (_, i) { return i; }).sort(function () { return Math.random() - .5; });
        var n = 0;
        function show() {
          if (!box.isConnected) return;
          var p = PHRASES[order[n++ % order.length]];
          var old = box.firstElementChild;
          if (old) { old.className = 'out'; setTimeout(function () { old.remove(); }, 350); }
          var el = document.createElement('div');
          el.textContent = '· ' + p + ' ·';
          box.appendChild(el);
          setTimeout(show, 1200);
        }
        show();
      })();
    </script>
    <script>
      // Frames are drawn from one sprite sheet onto a canvas: unlike <video>, nothing (iOS Low Power
      // Mode included) blocks it, so every phone gets the same crisp animation.
      // Each finished loop dispatches "splashloop" so the app knows when the dance has been seen.
      (function () {
        var FRAMES = 28, COLS = 7, SIZE = 640, FPS = 24;
        var canvas = document.querySelector('#splash canvas');
        var ctx = canvas.getContext('2d');
        var sprite = new Image();
        sprite.onload = function () {
          var start = performance.now(), loops = 0, last = -1;
          function tick() {
            if (!canvas.isConnected) return;
            var total = Math.floor(((performance.now() - start) / 1000) * FPS);
            var done = Math.floor(total / FRAMES);
            if (done > loops) { loops = done; window.dispatchEvent(new CustomEvent('splashloop', { detail: loops })); }
            if (total !== last) {
              last = total;
              var f = total % FRAMES;
              ctx.clearRect(0, 0, SIZE, SIZE);
              ctx.drawImage(sprite, (f % COLS) * SIZE, Math.floor(f / COLS) * SIZE, SIZE, SIZE, 0, 0, SIZE, SIZE);
            }
            setTimeout(tick, 1000 / FPS / 2);
          }
          tick();
        };
        sprite.src = '/loading-sprite.png';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
