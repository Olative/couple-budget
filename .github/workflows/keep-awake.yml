# Render's free plan puts the server to sleep after 15 minutes without visitors,
# so the app took up to a minute to open. This pings it every 10 minutes to keep it awake.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://couple-budget-z17f.onrender.com/api/health
